name: english-learning

x-backend-env: &backend-env
  DB_URL: jdbc:mysql://mysql:3306/english_learning?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&createDatabaseIfNotExist=true
  DB_USERNAME: root
  DB_PASSWORD: "123456"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_DATABASE: "0"
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_CONFIG_GROUP: DEFAULT_GROUP
  ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
  ADMIN_TOKEN_SECRET: english-learning-admin-secret
  INTERNAL_GATEWAY_SECRET: english-learning-internal-secret

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: english_learning
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p123456 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - english-learning

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - english-learning

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.10.0}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_ALLOW_CORS: "true"
      QDRANT__LOG_LEVEL: INFO
    restart: unless-stopped
    networks:
      - english-learning

  # ollama:
  #   image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     OLLAMA_NUM_PARALLEL: "2"
  #     OLLAMA_MAX_LOADED_MODELS: "1"
  #   restart: unless-stopped
  #   networks:
  #     - english-learning

  # ollama-init:
  #   image: curlimages/curl:latest
  #   depends_on:
  #     ollama:
  #       condition: service_started
  #   command: >
  #     sh -c '
  #       echo "waiting for ollama..."
  #       until curl -s http://ollama:11434/api/tags >/dev/null 2>&1; do
  #         sleep 2
  #       done
  #       echo "pulling bge-m3 model (this may take a few minutes)..."
  #       curl -s http://ollama:11434/api/pull -d "{\"name\":\"bge-m3\"}"
  #       echo "bge-m3 ready"
  #     '
  #   restart: "no"
  #   networks:
  #     - english-learning

  rocketmq-namesrv:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.3.1}
    # 镜像内实际路径是 /home/rocketmq/rocketmq-5.3.1（ROCKETMQ_HOME），挂载点须真实存在
    # 否则 uid=3000 的 rocketmq 用户对 root 属主卷目录无写权限，broker 会 NPE 退出
    working_dir: /home/rocketmq/rocketmq-5.3.1/bin
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn64m"
    ports:
      - "9876:9876"
    volumes:
      - rocketmq_namesrv_data:/home/rocketmq/rocketmq-5.3.1/store
    healthcheck:
      test: ["CMD-SHELL", "/home/rocketmq/rocketmq-5.3.1/bin/mqadmin clusterList -n localhost:9876 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - english-learning

  rocketmq-broker:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.3.1}
    working_dir: /home/rocketmq/rocketmq-5.3.1/bin
    command: sh mqbroker -n rocketmq-namesrv:9876
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn128m"
    ports:
      - "10909:10909"
      - "10911:10911"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    volumes:
      - rocketmq_broker_data:/home/rocketmq/rocketmq-5.3.1/store
    healthcheck:
      test: ["CMD-SHELL", "/home/rocketmq/rocketmq-5.3.1/bin/mqadmin brokerStatus -n rocketmq-namesrv:9876 -b rocketmq-broker:10911 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - english-learning

  rocketmq-dashboard:
    image: ${ROCKETMQ_DASHBOARD_IMAGE:-apacherocketmq/rocketmq-dashboard:latest}
    container_name: rocketmq-dashboard
    ports:
      - "8180:8082"        # 宿主机 8180 → 容器 8080，避免和 gateway 的 8081 混淆
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    networks:
      - english-learning

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.14.3}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 40s
    networks:
      - english-learning

  nacos:
    image: ${NACOS_IMAGE:-nacos/nacos-server:v2.5.3}
    environment:
      MODE: standalone
      NACOS_APPLICATION_PORT: "8848"
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - english-learning

  migration-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-17}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:17-jre-alpine}
        SERVICE_DIR: backend-services/migration-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/english_learning?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: "123456"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_CONFIG_GROUP: DEFAULT_GROUP
      MIGRATION_BASELINE_ON_MIGRATE: "true"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - english-learning

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-17}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:17-jre-alpine}
        SERVICE_DIR: backend-services/auth-service
    environment:
      <<: *backend-env
      AUTH_SERVICE_PORT: "8087"
    expose:
      - "8087"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      migration-service:
        condition: service_completed_successfully
    networks:
      - english-learning

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-17}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:17-jre-alpine}
        SERVICE_DIR: backend-services/user-service
    environment:
      <<: *backend-env
      USER_SERVICE_PORT: "8088"
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    expose:
      - "8088"
      - "5005"
    develop:
      watch:
        - action: rebuild          # 检测到变化就重新构建镜像并重启容器
          path: ./user-service/src
        - action: rebuild
          path: ./user-service/pom.xml
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      migration-service:
        condition: service_completed_successfully
    networks:
      - english-learning

  learning-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-17}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:17-jre-alpine}
        SERVICE_DIR: backend-services/learning-service
    environment:
      <<: *backend-env
      LEARNING_SERVICE_PORT: "8089"
    expose:
      - "8089"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      migration-service:
        condition: service_completed_successfully
    networks:
      - english-learning

  shop-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-17}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:17-jre-alpine}
        SERVICE_DIR: backend-services/shop-service
    environment:
      <<: *backend-env
      SHOP_SERVICE_PORT: "8090"
      ORDER_TIMEOUT_MINUTES: "10"
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8090:8090"
    expose:
      - "8090"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      migration-service:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - english-learning

  admin-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-17}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:17-jre-alpine}
        SERVICE_DIR: backend-services/admin-service
    environment:
      <<: *backend-env
      ADMIN_SERVICE_PORT: "8091"
    expose:
      - "8091"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      migration-service:
        condition: service_completed_successfully
    networks:
      - english-learning

  rag-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-17}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:17-jre-alpine}
        SERVICE_DIR: backend-services/rag-service
    environment:
      <<: *backend-env
      RAG_SERVICE_PORT: "8092"
      RAG_MAX_RESULTS: "5"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-1536}
      RAG_VECTOR_STORE: qdrant
      RAG_VECTOR_QDRANT_HOST: qdrant
      RAG_VECTOR_QDRANT_HTTP_PORT: "6333"
      RAG_VECTOR_DIMENSION: "1024"
      RAG_EMBEDDING_PROVIDER: ollama
      RAG_EMBEDDING_MODEL_NAME: bge-m3
      RAG_EMBEDDING_OLLAMA_BASE_URL: http://host.docker.internal:11434
      RAG_CHAT_PROVIDER: ollama
      RAG_CHAT_MODEL_NAME: qwen3.5:9b
      RAG_CHAT_OLLAMA_BASE_URL: http://host.docker.internal:11434
      RAG_OCR_MODEL: qwen2.5vl:7b
      RAG_OCR_MAX_PDF_PAGES: "50"
      RAG_OCR_VIDEO_FRAME_INTERVAL_SECONDS: "10"
      RAG_OCR_TIMEOUT_SECONDS: "120"
      RAG_RERANK_MODEL: qwen3-reranker:0.6b
      RAG_RERANK_ENABLED: "true"
      RAG_RERANK_TIMEOUT_SECONDS: "30"
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006"
    ports:
    - "8092:8092"
    - "5006:5006"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      migration-service:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - english-learning

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-17}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:17-jre-alpine}
        SERVICE_DIR: backend-services/gateway
    environment:
      GATEWAY_PORT: "8081"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_CONFIG_GROUP: DEFAULT_GROUP
      AUTH_SERVICE_URI: lb://auth-service
      USER_SERVICE_URI: lb://user-service
      LEARNING_SERVICE_URI: lb://learning-service
      SHOP_SERVICE_URI: lb://shop-service
      ADMIN_SERVICE_URI: lb://admin-service
      RAG_SERVICE_URI: lb://rag-service
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DATABASE: "0"
      ADMIN_TOKEN_SECRET: english-learning-admin-secret
      INTERNAL_GATEWAY_SECRET: english-learning-internal-secret
    ports:
      - "8081:8081"
    depends_on:
      - nacos
      - auth-service
      - user-service
      - learning-service
      - shop-service
      - admin-service
      - rag-service
      - redis
    networks:
      - english-learning

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
    environment:
      VITE_API_TARGET: http://gateway:8081
      VITE_API_BASE_URL: http://localhost:8081/api
      # JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - english-learning

volumes:
  mysql_data:
  redis_data:
  rocketmq_namesrv_data:
  rocketmq_broker_data:
  rocketmq_broker_logs:
  elasticsearch_data:
  nacos_data:
  nacos_logs:
  qdrant_data:
  ollama_data:

networks:
  english-learning:
    driver: bridge
