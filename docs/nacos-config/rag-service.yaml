server:
  port: ${RAG_SERVICE_PORT:8092}

spring:
  servlet:
    multipart:
      max-file-size: ${RAG_UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${RAG_UPLOAD_MAX_REQUEST_SIZE:25MB}

rag:
  max-results: ${RAG_MAX_RESULTS:5}
  chat:
    provider: ${RAG_CHAT_PROVIDER:ollama}
    api-key: ${RAG_CHAT_API_KEY:}
    model-name: ${RAG_CHAT_MODEL_NAME:qwen3.5:9b}
    base-url: ${RAG_CHAT_BASE_URL:https://api.openai.com/v1}
    ollama:
      base-url: ${RAG_CHAT_OLLAMA_BASE_URL:http://host.docker.internal:11434}
    memory:
      max-messages: ${RAG_CHAT_MEMORY_MAX_MESSAGES:20}
      keep-messages: ${RAG_CHAT_MEMORY_KEEP_MESSAGES:10}
      max-summary-chars: ${RAG_CHAT_MEMORY_MAX_SUMMARY_CHARS:2000}
  agent:
    enabled: ${RAG_AGENT_ENABLED:true}
  document:
    max-upload-bytes: ${RAG_DOCUMENT_MAX_UPLOAD_BYTES:20971520}
  chunk:
    max-chars: ${RAG_CHUNK_MAX_CHARS:800}
    overlap-chars: ${RAG_CHUNK_OVERLAP_CHARS:120}
  ocr:
    model: ${RAG_OCR_MODEL:qwen2.5vl:7b}
    max-pdf-pages: ${RAG_OCR_MAX_PDF_PAGES:50}
    video-frame-interval-seconds: ${RAG_OCR_VIDEO_FRAME_INTERVAL_SECONDS:10}
    timeout-seconds: ${RAG_OCR_TIMEOUT_SECONDS:120}
  rerank:
    model: ${RAG_RERANK_MODEL:qwen3-reranker:0.6b}
    enabled: ${RAG_RERANK_ENABLED:true}
    timeout-seconds: ${RAG_RERANK_TIMEOUT_SECONDS:30}
  vector:
    store: ${RAG_VECTOR_STORE:qdrant}
    dimension: ${RAG_EMBEDDING_DIMENSION:1024}
  embedding:
    provider: ${RAG_EMBEDDING_PROVIDER:ollama}
    model-name: ${RAG_EMBEDDING_MODEL_NAME:bge-m3}
    ollama:
      base-url: ${RAG_EMBEDDING_OLLAMA_BASE_URL:http://host.docker.internal:11434}

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:}
      model-name: ${RAG_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
