server:
  port: ${GATEWAY_PORT:8081}

spring:
  application:
    name: english-learning-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/auth/**
        - id: admin-service
          uri: ${ADMIN_SERVICE_URI:http://localhost:8091}
          predicates:
            - Path=/api/admin/**
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/user/**
        - id: learning-service
          uri: ${LEARNING_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/modules/**,/api/practice/**,/api/selected-readings/**
        - id: shop-service
          uri: ${SHOP_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/shop/**
        - id: auth-service-openapi
          uri: ${AUTH_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - SetPath=/v3/api-docs
        - id: user-service-openapi
          uri: ${USER_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - SetPath=/v3/api-docs
        - id: admin-service-openapi
          uri: ${ADMIN_SERVICE_URI:http://localhost:8091}
          predicates:
            - Path=/v3/api-docs/admin
          filters:
            - SetPath=/v3/api-docs
        - id: learning-service-openapi
          uri: ${LEARNING_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/v3/api-docs/learning
          filters:
            - SetPath=/v3/api-docs
        - id: shop-service-openapi
          uri: ${SHOP_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/v3/api-docs/shop
          filters:
            - SetPath=/v3/api-docs
        - id: english-learning-swagger
          uri: ${LEARNING_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/swagger-ui/**,/swagger-ui.html,/v3/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true 
