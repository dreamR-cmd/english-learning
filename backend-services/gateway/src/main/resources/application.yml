server:
  port: ${GATEWAY_PORT:8081}

spring:
  application:
    name: english-learning-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        - id: admin-service
          uri: ${ADMIN_SERVICE_URI:http://localhost:8091}
          predicates:
            - Path=/api/admin/**
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/user/**
        - id: learning-service
          uri: ${LEARNING_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/modules/**,/api/practice/**,/api/selected-readings/**
        - id: rag-service
          uri: ${RAG_SERVICE_URI:http://localhost:8092}
          predicates:
            - Path=/api/rag/**
        - id: shop-order-service
          uri: ${SHOP_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/shop/orders
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        - id: shop-service
          uri: ${SHOP_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/shop/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 30
                redis-rate-limiter.requestedTokens: 1
        - id: auth-service-openapi
          uri: ${AUTH_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - SetPath=/v3/api-docs
        - id: user-service-openapi
          uri: ${USER_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - SetPath=/v3/api-docs
        - id: admin-service-openapi
          uri: ${ADMIN_SERVICE_URI:http://localhost:8091}
          predicates:
            - Path=/v3/api-docs/admin
          filters:
            - SetPath=/v3/api-docs
        - id: learning-service-openapi
          uri: ${LEARNING_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/v3/api-docs/learning
          filters:
            - SetPath=/v3/api-docs
        - id: shop-service-openapi
          uri: ${SHOP_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/v3/api-docs/shop
          filters:
            - SetPath=/v3/api-docs
        - id: rag-service-openapi
          uri: ${RAG_SERVICE_URI:http://localhost:8092}
          predicates:
            - Path=/v3/api-docs/rag
          filters:
            - SetPath=/v3/api-docs
        - id: english-learning-swagger
          uri: ${LEARNING_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/swagger-ui/**,/swagger-ui.html,/v3/**

admin:
  token:
    secret: ${ADMIN_TOKEN_SECRET:english-learning-admin-secret}

gateway:
  auth:
    enabled: true
    exclude-paths:
      - /api/auth/login
      - /api/auth/register
      - /actuator/health
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /v3/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
