spring:
  application:
    name: admin-service
  config:
    import:
      - optional:nacos:english-learning-common.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
      - optional:nacos:admin-service.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
