server:
  port: ${LEARNING_SERVICE_PORT:8089}
spring:
  application:
    name: learning-service
  datasource:
    url: ${LEARNING_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/english_learning?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&createDatabaseIfNotExist=true}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${LEARNING_DB_USERNAME:${DB_USERNAME:root}}
    password: ${LEARNING_DB_PASSWORD:${DB_PASSWORD:123456}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: never

admin:
  token:
    secret: ${ADMIN_TOKEN_SECRET:english-learning-admin-secret}

springdoc:
  swagger-ui:
    urls:
      - name: 认证服务
        url: /v3/api-docs/auth
      - name: 后台管理服务
        url: /v3/api-docs/admin
      - name: 用户服务
        url: /v3/api-docs/user
      - name: 学习服务
        url: /v3/api-docs/learning
      - name: 商城服务
        url: /v3/api-docs/shop
    urls-primary-name: 学习服务
