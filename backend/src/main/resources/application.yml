server:
  port: 8081
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/english_learning?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
shop:
  order:
    timeout-minutes: ${ORDER_TIMEOUT_MINUTES:10}

ai:
  openai:
    api-key: ${OPENAI_API_KEY:sk-fb839071a7ebe9320af714f68ba73ecb9e63c2823fe37541e1658d79440fc9fe}
    api-base-url: ${OPENAI_API_BASE_URL:https://reecewong520--sub2api.modal.run/v1}
    model: ${OPENAI_MODEL:gpt-5.5}
    max-tokens: ${OPENAI_MAX_TOKENS:2048}
    temperature: ${OPENAI_TEMPERATURE:0.7}
    top-p: ${OPENAI_TOP_P:1.0}
    frequency-penalty: ${OPENAI_FREQUENCY_PENALTY:0.0}
    presence-penalty: ${OPENAI_PRESENCE_PENALTY:0.0}
